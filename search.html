<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用研知识库检索</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; min-height:100vh; }
.header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 40px 20px 30px; text-align:center; }
.header h1 { font-size: 28px; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: .85; }
.container { max-width: 900px; margin: 0 auto; padding: 0 16px; }
.search-box { margin-top: -20px; display:flex; gap:10px; background:#fff; padding:12px; border-radius:12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
.search-box input { flex:1; border:2px solid #e5e7eb; border-radius:8px; padding:12px 16px; font-size:15px; outline:none; transition:border-color .2s; }
.search-box input:focus { border-color: #4f46e5; }
.search-box button { background: #4f46e5; color:#fff; border:none; border-radius:8px; padding:12px 28px; font-size:15px; cursor:pointer; font-weight:600; transition:background .2s; }
.search-box button:hover { background: #4338ca; }
.search-box button:disabled { background: #9ca3af; cursor:not-allowed; }
.status { text-align:center; padding: 20px; color: #6b7280; font-size: 13px; }
.results { margin-top: 20px; }
.result-card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border-left: 4px solid #4f46e5; transition: box-shadow .2s; }
.result-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
.result-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.result-title { font-size: 16px; font-weight: 600; color: #1f2937; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-primary { background: #e0e7ff; color: #4f46e5; }
.badge-secondary { background: #fef3c7; color: #d97706; }
.badge-draft { background: #fee2e2; color: #dc2626; }
.result-snippet { font-size: 14px; color: #4b5563; line-height: 1.7; }
.result-score { font-size: 12px; color: #9ca3af; margin-top: 6px; }
.result-link { display: inline-block; margin-top: 8px; font-size: 13px; color: #4f46e5; text-decoration: none; }
.result-link:hover { text-decoration: underline; }
.empty { text-align:center; padding:60px 20px; color: #9ca3af; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.summary-bar { display:flex; gap:16px; flex-wrap:wrap; padding:10px 0; font-size:13px; color: #6b7280; }
.summary-bar span { background: #f3f4f6; padding:4px 12px; border-radius:6px; }
.error { background: #fef2f2; color: #dc2626; padding:16px; border-radius:8px; margin-top:12px; font-size:14px; }
</style>
</head>
<body>

<div class="header">
  <h1>用研知识库检索</h1>
  <p>搜索用户研究洞察，每条结果标注来源</p>
</div>

<div class="container">
  <div class="search-box">
    <input type="text" id="query" placeholder="输入关键词，如：买家采购、供应商选择、NPS调研..." autofocus>
    <button id="searchBtn" onclick="search()">搜索</button>
  </div>
  <div class="status" id="status">正在加载知识库...</div>
  <div id="results" class="results"></div>
</div>

<script>
let bundle = null;

const CDN_URL = 'https://cdn.jsdelivr.net/gh/CCC-ybw/ux-research-kb@main/kb_bundle.json';
const FALLBACK_URL = 'https://raw.githubusercontent.com/CCC-ybw/ux-research-kb/main/kb_bundle.json';

async function fetchBundle(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function loadBundle() {
  try {
    bundle = await fetchBundle(CDN_URL);
  } catch(e) {
    try {
      bundle = await fetchBundle(FALLBACK_URL);
    } catch(e2) {
      throw new Error('知识库加载失败：CDN 和备用地址均不可用');
    }
  }
}

function classifySource(filename) {
  const name = (filename || '').toLowerCase();
  if (name.startsWith('ur-b-') || name.startsWith('ur-s-')) return { type: '一手', cls: 'badge-primary' };
  if (/报告|分析|调研/.test(filename)) return { type: '二手', cls: 'badge-secondary' };
  if (/访谈|语录|逐字稿/.test(filename)) return { type: '一手', cls: 'badge-primary' };
  return { type: '未分类', cls: 'badge-draft' };
}

function tokenize(text) {
  const tokens = [];
  const eng = text.match(/[a-zA-Z0-9]+/g);
  if (eng) tokens.push(...eng.map(t => t.toLowerCase()));
  for (const ch of text) {
    if (ch >= '\u4e00' && ch <= '\u9fff') tokens.push(ch);
  }
  return tokens;
}

function searchBundle(query) {
  const files = bundle.files || [];
  const queryLower = query.toLowerCase();
  const queryTokens = tokenize(query);

  if (!queryTokens.length) return [];

  const scored = [];
  for (const f of files) {
    const title = f.title || '';
    const content = f.content || '';
    const titleLower = title.toLowerCase();
    const contentLower = content.toLowerCase();
    let score = 0;

    for (const t of queryTokens) {
      if (titleLower.includes(t)) score += 10;
      score += Math.min((contentLower.match(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length, 5);
    }
    if (contentLower.includes(queryLower)) score += 20;
    if (titleLower.includes(queryLower)) score += 30;

    if (score > 0) {
      let snippet = '';
      let bestPos = -1;
      for (const t of queryTokens) {
        const pos = contentLower.indexOf(t);
        if (pos !== -1) { bestPos = pos; break; }
      }
      if (bestPos >= 0) {
        const start = Math.max(0, bestPos - 40);
        const end = Math.min(content.length, bestPos + 200);
        snippet = (start > 0 ? '…' : '') + content.slice(start, end).trim() + (end < content.length ? '…' : '');
      }
      const cls = classifySource(title);
      scored.push({
        title,
        path: f.path || '',
        github_url: f.github_url || '',
        sourceType: cls.type,
        sourceClass: cls.cls,
        score,
        snippet: snippet || content.slice(0, 200) + '…',
        contentLength: content.length,
      });
    }
  }

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 10);
}

function renderResults(results, totalFiles) {
  const el = document.getElementById('results');
  if (!results.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div>未找到相关内容，试试换几个关键词</div></div>';
    return;
  }

  const typeCount = {};
  results.forEach(r => { typeCount[r.sourceType] = (typeCount[r.sourceType] || 0) + 1; });
  const summary = Object.entries(typeCount).map(([k, v]) => `${k}类 ${v} 条`).join(' · ');

  el.innerHTML = `
    <div class="summary-bar">
      <span>共 ${results.length} 条结果（知识库共 ${totalFiles} 个文件）</span>
      ${summary ? '<span>' + summary + '</span>' : ''}
    </div>
    ${results.map((r, i) => `
      <div class="result-card">
        <div class="result-header">
          <span class="result-title">${escapeHtml(r.title)}</span>
          <span class="badge ${r.sourceClass}">${r.sourceType}</span>
        </div>
        <div class="result-snippet">${escapeHtml(r.snippet)}</div>
        <div class="result-score">相关度: ${r.score} · 文档长度: ${r.contentLength} 字</div>
        ${r.github_url ? `<a class="result-link" href="${r.github_url}" target="_blank">查看源文件 →</a>` : ''}
      </div>
    `).join('')}
  `;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function search() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '搜索中...';

  if (!bundle) {
    document.getElementById('status').textContent = '知识库尚未加载，正在重新加载...';
    try { await loadBundle(); } catch(e) {}
  }

  if (!bundle) {
    document.getElementById('results').innerHTML = '<div class="error">知识库加载失败，请刷新页面重试</div>';
    btn.disabled = false;
    btn.textContent = '搜索';
    return;
  }

  await new Promise(r => setTimeout(r, 50)); // 让 UI 更新
  const results = searchBundle(query);
  renderResults(results, (bundle.files || []).length);

  btn.disabled = false;
  btn.textContent = '搜索';
}

// 回车搜索
document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});

// 初始化
(async function init() {
  try {
    await loadBundle();
    document.getElementById('status').textContent = `知识库加载完成，共 ${(bundle.files || []).length} 个文件，可以直接搜索`;
  } catch(e) {
    document.getElementById('status').textContent = '知识库加载失败，搜索时会自动重试';
  }
})();
</script>
</body>
</html>
